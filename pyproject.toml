[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"


[tool.setuptools_scm]
write_to = "src/splinebox/_version.py"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312', 'py313', 'py314', 'py315']

[tool.ruff]
line-length = 120
select = [
    "E", "F", "W", #flake8
    "UP", # pyupgrade
    "I", # isort
    "BLE", # flake8-blind-exception
    "B", # flake8-bugbear
    "A", # flake8-builtins
    "C4", # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "G", # flake8-logging-format
    "PIE", # flake8-pie
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long. let black handle this
    "E741", # Allow l as a variable name for loops
]

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
]

target-version = "py312"
fix = true

[tool.coverage.run]
# _version.py is generated by setuptools_scm and gitignored, so it can never
# map back to a file in the repository.
omit = ["*/_version.py"]

[project]
name = "splinebox"
dynamic = ["version"]
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "array-api-compat",
]
requires-python = ">= 3.10"
authors = [
    {name = "Florian Aymanns", email = "florian.aymanns@epfl.ch"},
    {name = "Virginie Uhlmann", email = "uhlmann@ebi.ac.uk"},
    {name = "Edward Andò", email = "edward.ando@epfl.ch"},
]
maintainers = [
    {name = "Florian Aymanns", email = "florian.aymanns@epfl.ch"},
]
description = "A python package for fitting splines."
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["splines", ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
test = [
    "tox",
    "pytest",
    "pytest-cov",
]
test-torch = [
    "splinebox[test]",
    "torch",
]
test-jax = [
    "splinebox[test]",
    "jax",
]
examples = [
    "matplotlib",
    "scikit-image",
    "pandas",
    "seaborn",
    "skan",
]
docs = [
    "splinebox[examples]",
    "sphinx-gallery",
    "sphinx-copybutton",
    "pydata-sphinx-theme",
    "sphinx-design",
    "pyvista[jupyter]",
    "numpydoc",
]
all = [
    "splinebox[test,examples,docs]",
    "splinebox[test-torch,test-jax]",
]

[project.urls]
Repository = "https://github.com/EPFL-Center-for-Imaging/splinebox"
